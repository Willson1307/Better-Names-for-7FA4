name: Package and Release to GitHub

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip cryptography

      - name: Create ZIP package
        env:
          USERS_DB_KEY: ${{ secrets.USERS_DB_KEY }}
        run: |
          python database/users_crypto_cli.py decrypt --input Better-Names-for-7FA4/data/users.json --output Better-Names-for-7FA4/data/users.json
          cd Better-Names-for-7FA4
          zip -r ../Better-Names-for-7FA4-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Better-Names-for-7FA4-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
