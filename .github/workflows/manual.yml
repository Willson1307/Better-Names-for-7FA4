name: Release Existing Tag to GitHub

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to package and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-existing-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag_name }}

      - name: Verify tag exists
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: git rev-parse "refs/tags/$TAG_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip cryptography

      - name: Create ZIP package
        env:
          USERS_DB_KEY: ${{ secrets.USERS_DB_KEY }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          python database/users_crypto_cli.py decrypt --input Better-Names-for-7FA4/data/users.json --output Better-Names-for-7FA4/data/users.json
          cd Better-Names-for-7FA4
          zip -r "../Better-Names-for-7FA4-$TAG_NAME.zip" .

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          files: Better-Names-for-7FA4-${{ inputs.tag_name }}.zip
          name: Release ${{ inputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
